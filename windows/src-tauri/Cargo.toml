[package]
name = "multi-finder"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "Multi-Finder for Windows"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mf-core = { path = "../core", features = ["llm", "ocr"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sys-locale = "0.3"
